<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Key Generator</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&display=swap" rel="stylesheet" />
</head>

<body>
  <main class="card">
    <div class="header">
      <div class="glow-orb"></div>
      <h1>Key Generator</h1>
    </div>

    <div class="device-selector">
      <select id="device">
        <option value="wiseeye">WiseEye On 39</option>
        <option value="ronaldjack">Ronald Jack Pro</option>
        <option value="mitaco5">Mitaco5 V2</option>
        <option value="ticoh">TicoH</option>
        <option value="mitaprov2">MitaProV2</option>
      </select>
    </div>

    <div class="input-group">
      <input id="sn" placeholder="Nhập số Serial (SN)" autocomplete="off" />
      <button id="gen">
        <span class="btn-text">Request Key</span>
        <span class="btn-glow"></span>
      </button>
    </div>

    <div id="result-container" class="hidden">
      <pre id="result"></pre>
    </div>

    <div id="terminal-wrapper" class="hidden">
      <div class="terminal-header">
        <span class="terminal-title">wine-server-logs</span>
      </div>
      <div id="terminal-body" class="terminal-body">
        <div id="terminal-content"></div>
        <div class="cursor"></div>
      </div>
    </div>
  </main>
  <script type="module" src="/main.js"></script>
</body>

</html>
